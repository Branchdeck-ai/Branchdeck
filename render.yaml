services:
  - type: web
    name: branchdeck-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: BRANCHDECK_ENV
        value: production
      - key: ALLOW_SQLITE_FALLBACK
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://branchdeck.vercel.app,http://localhost:3000
      - key: DATABASE_URL
        fromDatabase:
          name: branchdeck-db
          property: connectionString
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BRANCHDECK_ENCRYPTION_KEY
        sync: false
      - key: GITHUB_APP_ID
        value: "4859789"
      - key: GITHUB_APP_SLUG
        value: "branchdeck-ai"
      - key: GITHUB_APP_PRIVATE_KEY_B64
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        value: "branchdec_6786"
      - key: NEXT_PUBLIC_APP_URL
        value: https://branchdeck.vercel.app

databases:
  - name: branchdeck-db
    databaseName: branchdeck
    user: branchdeck_user
    plan: free
